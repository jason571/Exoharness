[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "exoharness-evolution"
version = "0.1.2"
description = "Bounded, evaluated publication of reusable ExoHarness experience Skills"
requires-python = ">=3.11"
dependencies = ["exoharness-benchmark>=0.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
