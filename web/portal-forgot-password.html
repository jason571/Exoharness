<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>找回密码 · ExoHarness</title>
<script src="/assets/portal-theme.js"></script><link rel="stylesheet" href="/assets/styles.css">
<script src="/assets/portal-forgot-password.js" defer></script><script src="/assets/i18n.js" defer></script></head>
<body class="portal-access-page"><main class="portal-access-shell"><section class="portal-access-card">
<span class="portal-access-mark" aria-hidden="true">EXO</span><h1>找回密码</h1>
<p>输入注册邮箱，我们会发送有效期为20分钟的密码重置链接。</p>
<form id="forgot-password-form" class="stack-form portal-access-form">
<label>邮箱<input id="forgot-password-email" type="email" autocomplete="email" maxlength="254" required autofocus></label>
<button id="forgot-password-submit" class="button primary" type="submit">发送重置链接</button></form>
<p id="password-message" class="portal-form-message hidden" role="status"></p>
<p id="password-error" class="login-error hidden" role="alert"></p>
<p class="portal-access-switch"><a href="/login">返回登录</a> · <a href="/forgot-password">重新申请重置链接</a></p>
</section></main></body></html>
