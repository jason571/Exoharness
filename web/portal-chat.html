<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0c">
  <title>对话 · ExoHarness</title>
  <script src="/assets/portal-theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/portal-auth.js" defer></script>
  <script src="/assets/chat.js" defer></script>
<script src="/assets/i18n.js" defer></script></head>
<body class="chat-page portal-page" data-portal="true">
  <main class="portal-shell">
    <aside class="portal-sidebar" aria-label="对话导航">
      <a class="portal-brand" href="/chat" aria-label="ExoHarness 对话">
        <span class="portal-brand-mark" aria-hidden="true">EXO</span>
        <span><strong>ExoHarness</strong><small>AI RUNTIME</small></span>
      </a>
      <button id="portal-sidebar-collapse" class="portal-sidebar-collapse" type="button" aria-label="折叠对话侧栏" aria-pressed="false" title="折叠对话侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-10-3 2 3 2"/></svg>
      </button>
      <button id="portal-history-toggle" class="portal-history-toggle" type="button" aria-controls="session-list" aria-expanded="false">
        <span class="portal-history-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>对话</span>
      </button>
      <button id="new-session" class="portal-new-chat" type="button"><span aria-hidden="true">＋</span> 新对话</button>
      <div class="portal-history-heading"><span>对话记录</span></div>
      <label class="portal-history-search"><span aria-hidden="true">⌕</span><input id="session-search" type="search" placeholder="搜索历史对话" aria-label="搜索历史对话" autocomplete="off"></label>
      <div id="session-list" class="session-list portal-session-list" aria-live="polite">
        <p class="session-list-empty">正在读取对话…</p>
      </div>
      <div class="portal-account">
        <button id="portal-account-toggle" type="button" aria-label="账号菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="portal-account-menu">
          <span id="portal-user-avatar" class="portal-user-avatar" aria-hidden="true">U</span>
          <span class="portal-account-copy"><strong id="portal-user-name">我的账号</strong><small id="portal-user-email"></small></span>
          <svg class="portal-account-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m8 14 4-4 4 4"/></svg>
        </button>
      </div>
    </aside>
    <button id="portal-session-scrim" class="portal-session-scrim" type="button" aria-label="关闭对话记录"></button>

    <section id="chat-drop-zone" class="chat-workspace portal-chat-workspace is-empty">
      <header class="chat-app-header portal-chat-header">
        <div class="chat-title-group">
          <span id="conversation-avatar" class="conversation-mark" aria-hidden="true">EXO</span>
          <div><h1 id="conversation-title">ExoHarness</h1><p id="conversation-status">新会话 · 发送后自动保存</p></div>
        </div>
        <div class="chat-header-actions">
          <span id="portal-engineering-hint" class="portal-engineering-hint" hidden>软件工程 · 私有项目沙盒</span>
          <div class="route-status portal-route-status" title="模型与能力由管理员统一配置"><span class="route-indicator" aria-hidden="true"></span><span>系统配置</span><strong id="route-status">正在读取</strong></div>
          <div class="service-state portal-service-state"><span id="service-dot" class="status-dot"></span><span id="service-label">正在连接</span></div>
          <button id="clear-chat" class="new-chat-button" type="button" title="开始新对话"><span aria-hidden="true">＋</span><span>新对话</span></button>
        </div>
      </header>
      <div id="chat-messages" class="chat-messages modern-chat-messages portal-chat-messages" aria-live="polite">
        <div class="chat-empty">
          <span class="empty-mark" aria-hidden="true"><span>EXO</span></span>
          <p class="chat-empty-kicker">EXOHARNESS AI</p>
          <strong>今天想一起做什么？</strong>
          <p class="chat-empty-copy" data-static-copy="true">制作宣传视频、设计海报、创作音乐，或撰写文档与 PPT——告诉我你的主题和要求。</p>
        </div>
      </div>
      <button id="scroll-latest" class="scroll-latest hidden" type="button" aria-label="滚动到最新消息"><span aria-hidden="true">↓</span> 回到最新消息</button>
      <div class="chat-composer-wrap portal-composer-wrap">
        <div id="speech-input-status" class="speech-input-status" role="status" hidden><span data-speech-label></span><button type="button">取消</button></div>
        <div id="pending-attachments" class="pending-attachments hidden"></div>
        <form id="chat-form" class="modern-chat-form portal-chat-form">
          <textarea id="chat-prompt" rows="1" placeholder="发送消息…" aria-label="发送消息"></textarea>
          <div class="composer-actions">
            <label class="attach-button" title="添加参考文件"><input id="chat-attachments" type="file" multiple><span class="attach-icon" aria-hidden="true">＋</span><span>添加文件</span></label>
            <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
            <div class="composer-primary-actions"><button id="chat-stop" class="chat-stop hidden" type="button" title="停止当前运行"><span aria-hidden="true">■</span><span>停止</span></button>
              <button id="chat-microphone" class="chat-microphone" type="button" title="正在检测语音服务…" aria-label="正在检测语音服务…" aria-pressed="false" aria-disabled="true" data-availability="checking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button>
              <button id="chat-send" class="chat-send" type="submit" aria-label="发送消息" title="发送消息" disabled><span aria-hidden="true">↑</span></button></div>
          </div>
        </form>
        <p class="composer-disclaimer">AI 生成内容可能有误，请核对重要信息</p>
      </div>
      <div id="drop-overlay" class="drop-overlay hidden">释放文件添加到对话</div>
    </section>
    <section id="portal-settings-workspace" class="portal-settings-workspace" aria-label="账号设置" hidden>
      <iframe id="portal-settings-frame" title="账号设置"></iframe>
    </section>
  </main>
  <div id="portal-account-menu" class="portal-account-menu" role="menu" aria-label="账号" hidden>
    <a href="/settings#password" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>修改密码</span></a>
    <button id="portal-appearance-toggle" type="button" role="menuitem" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>外观</span><small id="portal-appearance-label">暗色</small></button>
    <div id="portal-theme-options" class="portal-theme-options" role="group" aria-label="外观风格" hidden><button type="button" data-portal-theme="light" aria-pressed="false">明亮</button><button type="button" data-portal-theme="dark" aria-pressed="true">暗色</button></div>
    <button type="button" role="menuitem" aria-disabled="true" title="积分查询即将开放"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m12 7 1.5 3 3.5.5-2.5 2.5.5 3.5-3-1.5-3 1.5.5-3.5L7 10.5l3.5-.5Z"/></svg><span>积分查询</span><small>即将开放</small></button>
    <a href="/settings" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h6l1-3 3-2-1-3 2-2-2-3-3-1-1-3Z"/></svg><span>设置</span></a>
    <a href="/settings#capabilities" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>我的能力</span></a>
    <a href="/settings#knowledge" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8"/></svg><span>我的资料</span></a>
    <a href="/settings#memory" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6a5 5 0 0 1 10 0v2a4 4 0 0 1 0 8v2H7v-2a4 4 0 0 1 0-8zM9 20h6"/></svg><span>我的记忆</span></a>
    <div class="portal-menu-divider" role="separator"></div>
    <button id="portal-logout" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5m5-12 4 4-4 4m-6-4h10"/></svg><span>退出登录</span></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
