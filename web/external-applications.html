<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部应用 · ExoHarness</title>
<script src="/assets/management-theme.js"></script><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/management-theme.css"><link rel="stylesheet" href="/assets/management.css"><link rel="stylesheet" href="/assets/external-applications.css">
<script src="/assets/auth.js" defer></script><script src="/assets/external-applications.js" defer></script><script src="/assets/i18n.js" defer></script></head>
<body><header class="topbar management-header"><a class="brand" href="/overview"><span class="brand-mark">EH</span><span><strong>ExoHarness</strong><small>管理控制台</small></span></a><nav class="main-nav" aria-label="主导航"><a href="/external-applications" class="active" data-admin-only>外部应用</a></nav><div class="service-state"><span id="service-dot" class="status-dot"></span><span id="service-label">正在连接服务</span></div></header>
<main class="page management-page"><section class="management-heading"><div><p class="eyebrow">APPLICATIONS</p><h1>外部应用</h1><p>为不同应用分别配置 Key、助理角色和用户授权。</p></div><button id="external-new" class="button secondary" type="button">新增应用</button></section><p id="external-message" role="status"></p>
<section class="external-grid"><article class="panel management-panel"><div class="panel-header"><h2 id="external-form-title">新增应用</h2><a href="/agents">管理助理角色</a></div>
<form id="external-form" class="stack-form"><label>应用 ID<input id="external-client" required maxlength="128" pattern="[A-Za-z0-9_.-]+" autocomplete="off" placeholder="carenest"></label><label>应用名称<input id="external-name" required maxlength="200" autocomplete="off"></label><label>绑定助理<select id="external-assistant" required></select></label><button id="external-template" class="button secondary" type="button">创建 CareNest 示例助理</button>
<fieldset><legend>允许申请的权限</legend><div id="external-scopes" class="external-scopes"></div></fieldset>
<div class="external-fields"><label>访问凭证有效期（秒）<input id="external-access-ttl" type="number" min="60" max="900" value="300" required></label><label>用户授权有效期（秒）<input id="external-grant-ttl" type="number" min="300" max="2592000" value="2592000" required></label></div><label class="external-check"><input id="external-enabled" type="checkbox" checked>启用应用</label>
<div class="external-actions"><button id="external-save" class="button primary" type="submit">保存应用</button><button id="external-rotate" class="button secondary" type="button" hidden>轮换 Key</button></div></form></article>
<article class="panel management-panel"><div class="panel-header"><h2>已登记应用</h2><button id="external-refresh" class="button secondary" type="button">刷新</button></div><div id="external-list"></div></article></section>
<section class="panel management-panel"><div class="panel-header"><h2>用户授权</h2></div><p id="external-grants-note">选择应用后查看用户授权。</p><div id="external-grants"></div></section>
</main>
<dialog id="external-key-dialog" class="external-key-dialog"><h2>应用 Key</h2><p>Key 已加密保存，管理员可确认后查看和复制。</p><label>应用 ID<input id="external-issued-client" readonly data-i18n="off"></label><label>应用 Key<input id="external-issued-secret" readonly data-i18n="off" autocomplete="off" spellcheck="false"></label><div class="external-actions"><button id="external-copy" class="button secondary" type="button">复制 Key</button><button id="external-key-close" class="button primary" type="button">关闭</button></div></dialog></body></html>
