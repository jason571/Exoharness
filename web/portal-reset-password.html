<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><title>设置新密码 · ExoHarness</title>
<script src="/assets/portal-theme.js"></script><link rel="stylesheet" href="/assets/styles.css">
<script src="/assets/portal-reset-password.js" defer></script><script src="/assets/i18n.js" defer></script></head>
<body class="portal-access-page"><main class="portal-access-shell"><section class="portal-access-card">
<span class="portal-access-mark" aria-hidden="true">EXO</span><h1>设置新密码</h1>
<p id="reset-password-status">正在检查重置链接...</p>
<form id="reset-password-form" class="stack-form portal-access-form"><fieldset id="reset-password-fields" disabled class="stack-form" style="border:0;padding:0;margin:0;min-width:0">
<label>新密码<input id="reset-password-new" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label>
<label>确认新密码<input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label>
<button id="reset-password-submit" class="button primary" type="submit">重置密码</button></fieldset></form>
<p id="password-message" class="portal-form-message hidden" role="status"></p>
<p id="password-error" class="login-error hidden" role="alert"></p>
<p class="portal-access-switch"><a href="/login">返回登录</a> · <a href="/forgot-password">重新申请重置链接</a></p>
</section></main></body></html>
