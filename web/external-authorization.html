<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExoHarness · Application authorization</title>
<style nonce="%NONCE%">:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:32px 16px;background:Canvas;color:CanvasText}main{max-width:480px;margin:auto;border:1px solid GrayText;border-radius:16px;padding:24px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid GrayText;border-radius:8px;background:Canvas;color:CanvasText}button{margin-top:16px;cursor:pointer}button:disabled{opacity:.6}#notice{white-space:pre-wrap}a{color:LinkText}.hidden{display:none}small{display:block;margin-top:12px}</style></head>
<body><main><h1>Connect your account</h1><p id="summary"></p><p id="permissions"></p>
<form id="login"><label for="identifier">Username or email</label><input id="identifier" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form>
<p id="register"><a href="/" target="_blank" rel="noopener noreferrer">Create an ExoHarness account</a>, then return here to sign in.</p>
<section id="consent" class="hidden"><p id="account"></p><p>This application can use the permissions below on your behalf. Your conversations remain owned by your account.</p><button id="approve" type="button">Allow and continue</button><button id="deny" type="button">Cancel</button><button id="switch" type="button">Use another account</button></section><p id="notice" role="status"></p><small>Your password stays with ExoHarness. The application receives a limited access credential.</small></main>
<script nonce="%NONCE%">
const data=%DATA%;const $=id=>document.getElementById(id);let session;
$('summary').textContent=`${data.application_name} would like to connect using assistant ${data.assistant_name}.`;
$('permissions').textContent=`Permissions: ${data.request.scope}`;
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options});let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(body.message||body.error?.message||'The request could not be completed.');return body;}
async function refresh(){try{session=await api('/v1/auth/session');if(!session.account)throw Error('Sign in to continue.');$('account').textContent=`Signed in as ${session.account.display_name} (${session.account.username})`;$('login').classList.add('hidden');$('register').classList.add('hidden');$('consent').classList.remove('hidden');$('notice').textContent='';}catch{$('login').classList.remove('hidden');$('register').classList.remove('hidden');$('consent').classList.add('hidden');}}
$('login').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});$('password').value='';await refresh();}catch(error){$('notice').textContent=error.message;}finally{button.disabled=false;}});
$('approve').onclick=async()=>{$('approve').disabled=true;try{const result=await api('/v1/external/authorize',{method:'POST',headers:{'Content-Type':'application/json','x-exoharness-csrf':session.csrf_token},body:JSON.stringify({request:data.request,confirm:true})});location.replace(result.redirect_uri);}catch(error){$('notice').textContent=error.message;$('approve').disabled=false;}};
$('deny').onclick=()=>{const target=new URL(data.request.redirect_uri);target.searchParams.set('error','access_denied');target.searchParams.set('state',data.request.state);location.replace(target.href);};
$('switch').onclick=async()=>{try{await api('/v1/auth/logout',{method:'POST',headers:{'x-exoharness-csrf':session.csrf_token}});await refresh();}catch(error){$('notice').textContent=error.message;}};
refresh();
</script></body></html>
